<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal Productivity Dashboard — manage your time, tasks, and links in one place." />
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="css/index.css" />
  </head>

  <body>

    <!-- ======================================================
         HEADER — Greeting, time/date, theme toggle
    ====================================================== -->
    <header>
      <section aria-label="Greeting and time">
        <h1 id="greeting">Good morning!</h1>
        <time id="current-time" aria-live="polite"></time>
        <p id="current-date"></p>
      </section>

      <button
        id="theme-toggle"
        aria-label="Toggle light/dark mode"
        title="Toggle theme"
      >
        <img
          id="theme-icon"
          src="asset/moon.svg"
          alt="Switch to light mode"
          width="22"
          height="22"
        />
      </button>
    </header>

    <!-- ======================================================
         MAIN — two-column middle row + full-width todo
    ====================================================== -->
    <main>

      <!-- ---- Middle row: Timer + To-Do List side by side ---- -->
      <section class="middle-row" aria-label="Timer and to-do list">

        <!-- FOCUS TIMER CARD -->
        <article class="card" aria-label="Focus timer">
          <header>
            <h2>Focus Timer</h2>
          </header>

          <output id="timer-display" aria-live="polite" aria-atomic="true">25:00</output>

          <menu>
            <li>
              <button id="timer-start" aria-label="Start timer">Start</button>
            </li>
            <li>
              <button id="timer-stop" aria-label="Stop timer" disabled>Stop</button>
            </li>
            <li>
              <button id="timer-reset" aria-label="Reset timer">Reset</button>
            </li>
          </menu>

          <form id="timer-settings" aria-label="Timer duration settings">
            <label for="timer-duration">Set duration (minutes)</label>
            <input
              type="number"
              id="timer-duration"
              name="timer-duration"
              min="1"
              max="60"
              value="25"
              aria-describedby="timer-duration-hint"
            />
            <small id="timer-duration-hint">Enter a value between 1 and 60 minutes.</small>
            <button type="submit">Apply</button>
          </form>
        </article>

        <!-- TO-DO LIST CARD -->
        <article class="card todo-section" aria-label="To-do list">
          <header>
            <h2>To-Do List</h2>
            <output id="task-count" aria-live="polite"></output>
          </header>

          <form id="task-form" aria-label="Add a new task">
            <label for="task-input">New task</label>
            <input
              type="text"
              id="task-input"
              name="task-input"
              placeholder="What needs to be done?"
              required
              autocomplete="off"
              aria-describedby="task-error"
            />
            <button type="submit">Add Task</button>
          </form>

          <p id="task-error" class="error-msg" role="alert" aria-live="assertive" hidden></p>

          <ul id="task-list" aria-label="Task list">
            <!-- Tasks rendered by JS -->
          </ul>

          <p id="tasks-empty" class="empty-state" hidden>
            No tasks yet. Add something above!
          </p>

        </article>

      </section><!-- /middle-row -->

      <!-- ---- Full-width: Quick Links ---- -->
      <section class="card" aria-label="Quick links">
        <header>
          <h2>Quick Links</h2>
        </header>

        <form id="link-form" aria-label="Add a new quick link">
          <label for="link-name">Name</label>
          <input
            type="text"
            id="link-name"
            name="link-name"
            placeholder="e.g. GitHub"
            required
            autocomplete="off"
          />

          <label for="link-url">URL</label>
          <input
            type="url"
            id="link-url"
            name="link-url"
            placeholder="https://example.com"
            required
            autocomplete="off"
          />

          <button type="submit">Add Link</button>
        </form>

        <nav aria-label="Saved quick links">
          <ul id="links-list" aria-label="Quick links list">
            <!-- Links rendered by JS -->
          </ul>
          <p id="links-empty" class="empty-state" hidden>
            No links yet. Add your first one above!
          </p>
        </nav>
      </section>

    </main>

    <script src="js/index.js"></script>
  </body>
</html>
